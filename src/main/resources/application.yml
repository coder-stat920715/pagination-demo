spring:
  application:
    name: pagination-demo

  datasource:
    url: jdbc:h2:mem:paginationdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true
        generate_statistics: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /api-docs

logging:
  level:
    root: INFO
    com.example.paginationdemo: INFO
    # Flip to DEBUG/TRACE during the live demo to show the actual SQL +
    # bind parameters for OFFSET vs keyset WHERE clauses side by side.
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
